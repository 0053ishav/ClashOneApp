name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Expo ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  test:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest test suite
        run: npm test -- --ci --runInBand

  fingerprint:
    name: Compare Android fingerprints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      android: ${{ steps.compare.outputs.android }}
      android_hash: ${{ steps.compare.outputs.android_hash }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install current dependencies
        run: npm ci

      - name: Generate current Android fingerprint
        run: npx --no-install fingerprint fingerprint:generate --platform android > "$RUNNER_TEMP/current-android-fingerprint.json"

      - name: Compare against pull request base
        id: compare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          current_hash=$(jq -er '.hash' "$RUNNER_TEMP/current-android-fingerprint.json")
          echo "android_hash=$current_hash" >> "$GITHUB_OUTPUT"

          # Pushes to main always receive native build validation.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If the base commit cannot be evaluated, fail safe and build.
          if [[ -z "$BASE_SHA" ]] || ! git cat-file -e "$BASE_SHA:package-lock.json"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_dir="$RUNNER_TEMP/android-fingerprint-base"
          mkdir -p "$base_dir"
          git archive "$BASE_SHA" | tar -x -C "$base_dir"

          # Workflow changes invalidate the decision to skip native validation.
          workflow_changed=false
          if ! git diff --quiet "$BASE_SHA" HEAD -- .github/workflows/ci.yml; then
            workflow_changed=true
          fi

          (
            cd "$base_dir"
            npm ci
          )

          (
            cd "$base_dir"
            npx --no-install fingerprint fingerprint:generate --platform android
          ) > "$RUNNER_TEMP/base-android-fingerprint.json"

          base_hash=$(jq -er '.hash' "$RUNNER_TEMP/base-android-fingerprint.json")

          if [[ "$workflow_changed" == "false" && "$current_hash" == "$base_hash" ]]; then
            echo "Android fingerprint unchanged; skipping native build for this pull request."
            echo "android=false" >> "$GITHUB_OUTPUT"
          else
            echo "Android fingerprint changed or workflow changed; native build is required."
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

  android_build:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: fingerprint
    if: github.event_name == 'push' || needs.fingerprint.outputs.android == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v1-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v1-
            ${{ runner.os }}-gradle-

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-one-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  required_ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - fingerprint
      - android_build
    steps:
      - name: Verify required checks
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          FINGERPRINT_RESULT: ${{ needs.fingerprint.result }}
          ANDROID_RESULT: ${{ needs.android_build.result }}
          ANDROID_REQUIRED: ${{ needs.fingerprint.outputs.android }}
        run: |
          set -euo pipefail

          for check in LINT TYPECHECK TEST FINGERPRINT; do
            result_var="${check}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "success" ]]; then
              echo "::error::$check check did not succeed (result: $result)"
              exit 1
            fi
          done

          if [[ "$ANDROID_RESULT" == "success" ]]; then
            echo "Android native build passed."
          elif [[ "$ANDROID_RESULT" == "skipped" && "$ANDROID_REQUIRED" == "false" ]]; then
            echo "Android build was safely skipped because the native fingerprint is unchanged."
          else
            echo "::error::Android build did not succeed as expected (result: $ANDROID_RESULT, required: $ANDROID_REQUIRED)"
            exit 1
          fi

          echo "All required CI checks passed."
