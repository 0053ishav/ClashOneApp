appId: com.strngelabs.clashone
name: Critical app smoke
---
# Destructive test: clears app data, imports a demo village, and checks core navigation.
# Run only against a dedicated test device/emulator.
- launchApp:
    clearState: true

# Onboarding has three slides; the first title is "Clash One".
- extendedWaitUntil:
    visible: "Clash One"
    timeout: 30000
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Get Started"

# The app routes to Add Your Village after onboarding.
- extendedWaitUntil:
    visible: "Add Your Village"
    timeout: 30000
- tapOn: "Use Demo Account"

- extendedWaitUntil:
    visible: "Demo Village Loaded"
    timeout: 30000
- tapOn: "OK"

- extendedWaitUntil:
    visible: "All Set!"
    timeout: 30000
- tapOn: "Continue"

# "Clash One" is not a reliable Home-screen assertion; use actual village controls.
- extendedWaitUntil:
    visible: "Home village"
    timeout: 30000
- assertVisible: "Builder base village"

- tapOn: "Builder base village"
- waitForAnimationToEnd
- assertVisible: "Home village"
- assertVisible: "Builder base village"

- tapOn: "Home village"
- waitForAnimationToEnd

- tapOn: "Settings"
- waitForAnimationToEnd
- assertVisible: "Settings"
- assertVisible: "Active village"

- tapOn: "Home"
- waitForAnimationToEnd
- assertVisible: "Home village"
