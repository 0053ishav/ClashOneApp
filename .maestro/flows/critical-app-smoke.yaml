appId: com.strngelabs.clashone
name: Critical app smoke
---
# Destructive test: clears app data, opens the Expo development client, imports a demo village, and checks core navigation.
# Run only against a dedicated test device/emulator.
- launchApp:
    clearState: true

# Open the development build through the Expo development-client deep link.
- openLink:
    link: "exp+clash-one://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- waitForAnimationToEnd

# Onboarding has three slides; the first title is "Clash One".
- extendedWaitUntil:
    visible: "Clash One"
    timeout: 30000
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Get Started"

# Continue through the account connection/demo-import path.
- tapOn: "Connect"
- tapOn: "Use Demo Account"

- extendedWaitUntil:
    visible: "Demo Village Loaded"
    timeout: 30000
- tapOn: "OK"

- extendedWaitUntil:
    visible: "All Set!"
    timeout: 30000
- tapOn: "Continue"

# Use the village selector rather than assuming the app title appears on Home.
- extendedWaitUntil:
    visible: "Home village"
    timeout: 30000
- assertVisible: "Builder base village"

- tapOn: "Builder base village"
- waitForAnimationToEnd
- assertVisible: "Home village"
- assertVisible: "Builder base village"

- tapOn: "Home village"
- waitForAnimationToEnd

- tapOn: "Settings"
- waitForAnimationToEnd
- assertVisible: "Active village"

- tapOn: "Home"
- waitForAnimationToEnd
- assertVisible: "Home village"
