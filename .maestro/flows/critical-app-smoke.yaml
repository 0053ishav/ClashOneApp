appId: com.strngelabs.clashone
name: Critical app smoke
---
# Destructive test: clears app data, opens the Expo development client, imports a demo village, and checks core navigation.
# Run only against a dedicated test device/emulator with Metro running.
- launchApp:
    clearState: true

# The dev client may first show its server list, then a developer-menu Continue screen.
- openLink:
    link: "exp+clash-one://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- waitForAnimationToEnd
- tapOn: "http://localhost:8081"
- waitForAnimationToEnd
- tapOn: "Continue"
- waitForAnimationToEnd

# Onboarding has three slides; the first title is "Clash One".
- extendedWaitUntil:
    visible: "Clash One"
    timeout: 30000
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Get Started"

# Continue through the account connection/demo-import path.
- tapOn: "Connect"
- tapOn: "Use Demo Account"

- extendedWaitUntil:
    visible: "Demo Village Loaded"
    timeout: 30000
- tapOn: "OK"

- extendedWaitUntil:
    visible: "All Set!"
    timeout: 30000
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
    timeout: 15000
- tapOn: "Continue"

# Verify the village selector on the app Home screen.
- extendedWaitUntil:
    visible: "Home village"
    timeout: 30000
- assertVisible: "Builder base village"

- tapOn: "Builder base village"
- waitForAnimationToEnd
- assertVisible: "Home village"
- assertVisible: "Builder base village"

- tapOn: "Home village"
- waitForAnimationToEnd

- tapOn: "Settings"
- waitForAnimationToEnd
- assertVisible: "Active village"

# Disambiguate the app's Home tab from Android's system Home action.
- tapOn:
    text: "Home"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Home village"
